[package]
name = "tauri-demo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony", features = [
] }

[dependencies]
tauri = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony", features = [
] }
tauri-plugin-opener = "2"
tauri-plugin-ohos-demo = { path = "tauri-plugin-ohos-demo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi-ohos = { version = "1.1" }
napi-derive-ohos = "1.1"


# 固定 openharmony-ability 到 295a276a（2026-06-30，#64；c6c4c9a #67 移除 webview
# feature 之前的最后可用状态）。wry/tauri/tao fork 的 manifest 已声明同 rev
[patch.crates-io]
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "295a276a699ba2352addc69b8cacb6acd3be6ab1" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "295a276a699ba2352addc69b8cacb6acd3be6ab1" }


tauri = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-runtime = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-utils = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-macros = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-runtime-wry = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }


