[package]
name = "tauri-demo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony", features = [] }

[dependencies]
tauri = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony", features = ["tray-icon"] }
tauri-plugin-opener = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-os = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-clipboard-manager = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-dialog = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-log = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-window-state = { git = "https://github.com/richerfu/plugins-workspace", branch = "feat-openharmony" }
tauri-plugin-ohos-demo = { path = "tauri-plugin-ohos-demo" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = "1.2"
napi-derive-ohos = "1.2"
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
